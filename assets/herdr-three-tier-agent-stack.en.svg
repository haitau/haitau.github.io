<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="100%">
  <style>
    
    text {
      font-family: 'JetBrains Mono', 'SF Mono', 'Noto Sans', sans-serif;
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Vertical Connectors between tiers -->
  <line x1="460" y1="150" x2="460" y2="178" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="460" y1="258" x2="460" y2="286" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Tier 1: Control Plane -->
  <rect x="40" y="70" width="840" height="80" rx="8" fill="#f8fafc"/>
  <rect x="40" y="70" width="840" height="80" rx="8" fill="rgba(6,182,212,0.12)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="65" y="102" fill="#0891b2" font-size="12.5" font-weight="700">Tier 1: Control Plane — Provider: herdr</text>
  <text x="65" y="124" fill="#0f172a" font-size="10" font-weight="600">Governs "Where Work Runs": State Indicators (working/blocked/done/idle) · Pane Lifecycle · start / wait / prompt</text>
  <text x="65" y="141" fill="#475569" font-size="9">Boundary Rule: prompt / send-keys only dispatches short task triggers, never bulky cross-agent context</text>

  <!-- Tier 2: Session Layer -->
  <rect x="40" y="178" width="840" height="80" rx="8" fill="#f8fafc"/>
  <rect x="40" y="178" width="840" height="80" rx="8" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.6"/>
  <text x="65" y="210" fill="#059669" font-size="12.5" font-weight="700">Tier 2: Session Layer — Provider: Native Agent CLIs</text>
  <text x="65" y="232" fill="#0f172a" font-size="10" font-weight="600">Governs "Conversation State": Per-Directory Transcripts · -c (Continue) · -r (Resume) · --fork (Branch Session)</text>
  <text x="65" y="249" fill="#475569" font-size="9">Boundary Rule: Survives herdr Server restarts or terminal host migrations without losing conversation history</text>

  <!-- Tier 3: Memory Layer -->
  <rect x="40" y="286" width="840" height="80" rx="8" fill="#f8fafc"/>
  <rect x="40" y="286" width="840" height="80" rx="8" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="65" y="318" fill="#7c3aed" font-size="12.5" font-weight="700">Tier 3: Memory Layer — Provider: Semantic Memory Store (e.g., OpenViking MCP)</text>
  <text x="65" y="340" fill="#0f172a" font-size="10" font-weight="600">Governs "What Persists Across Agents &amp; Sessions": Explicit URI Writes (viking://...) → Semantic Search &amp; Read</text>
  <text x="65" y="357" fill="#475569" font-size="9">Boundary Rule: Cross-agent architectural decisions &amp; root causes flow through Memory Layer, never terminal scrollback</text>

  <!-- Title -->
  <text x="40" y="42" fill="#0f172a" font-size="15" font-weight="700">Three-Tier Orthogonal Multi-Agent Stack: Control Plane × Session Layer × Memory Layer</text>
</svg>
