<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background-color:#F8FAFC;">
  <style>
    .diagram-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
    .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
    .node-dark { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #0F172A !important; text-anchor: middle; }
    .node-light { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #FFFFFF !important; text-anchor: middle; }
    .node-purple { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #6B21A8 !important; text-anchor: middle; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #E2E8F0 !important; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B !important; text-anchor: middle; }
  </style>

  <text x="600" y="40" class="diagram-title">图 2.4：专题下钻 C - Dynamic MCP Resolver (向量寻址 × 连接器网关两段式)</text>

  <!-- 左：任务上下文 -->
  <g transform="translate(100, 270)">
    <rect width="220" height="80" rx="8" fill="#B45309" stroke="#92400E"/>
    <text x="110" y="45" class="node-light">Task 上下文</text>
  </g>

  <!-- 中上：Top-N 降维工具集 -->
  <g transform="translate(440, 100)">
    <rect width="320" height="70" rx="8" fill="#059669" stroke="#047857"/>
    <text x="160" y="30" class="node-light">Top-N 降维工具集</text>
    <text x="160" y="50" class="node-sub">(按需挂载 · 即用即卸)</text>
  </g>

  <!-- 中：Resolver 向量语义寻址层 -->
  <g transform="translate(440, 270)">
    <rect width="320" height="80" rx="8" fill="#065F46" stroke="#047857"/>
    <text x="160" y="35" class="node-light">Dynamic MCP Resolver</text>
    <text x="160" y="55" class="node-sub">(向量语义寻址层 · 解决"该用哪几个")</text>
  </g>

  <!-- 中下：Connector Gateway 统一接入层 -->
  <g transform="translate(440, 440)">
    <rect width="320" height="90" rx="8" fill="#047857" stroke="#065F46"/>
    <text x="160" y="32" class="node-light">Connector Gateway 连接器网关</text>
    <text x="160" y="52" class="node-sub">(统一接入层 · OpenConnector 工程实证)</text>
    <text x="160" y="70" class="node-sub">(解决"能不能连")</text>
  </g>

  <!-- 右：工具池 -->
  <g transform="translate(880, 430)">
    <rect width="220" height="110" rx="8" fill="#0F172A" stroke="#020617"/>
    <text x="110" y="42" class="node-light">SaaS / 业务系统工具池</text>
    <text x="110" y="64" class="node-sub">(1000+ Providers</text>
    <text x="110" y="82" class="node-sub">10000+ Actions)</text>
  </g>

  <!-- 连线 -->
  <path d="M 320 310 L 440 310" stroke="#B45309" stroke-width="3" fill="none" marker-end="url(#ar3)"/>
  <text x="380" y="298" class="edge-label">1. 向量语义查询</text>

  <path d="M 600 350 L 600 440" stroke="#065F46" stroke-width="3" fill="none" marker-end="url(#ar3)"/>
  <text x="712" y="398" class="edge-label">2. 服务目录检索 · 按需暴露</text>

  <path d="M 760 485 L 880 485" stroke="#047857" stroke-width="3" fill="none" marker-end="url(#ar3)"/>
  <text x="820" y="473" class="edge-label">统一接入</text>

  <path d="M 600 270 L 600 170" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#ar3)"/>
  <text x="682" y="223" class="edge-label">3. Top-N 降维过滤</text>

  <path d="M 440 135 L 210 135 L 210 270" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#ar3)"/>
  <text x="320" y="122" class="edge-label">4. 动态注入 Context</text>

  <defs><marker id="ar3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
</svg>
