<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <marker id="m-flow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect x="25" y="25" width="1150" height="670" rx="16" fill="#FFFFFF" fill-opacity="0.7" stroke="#E2E8F0" stroke-width="1.5" filter="url(#soft-shadow)"/>

  <!-- Title -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="6" height="26" rx="3" fill="#6366F1"/>
    <text x="18" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#0F172A" letter-spacing="-0.5px">
      Figure 6.1: CLI Engine 9-Step Atomic Assembly Pipeline
    </text>
    <rect x="910" y="2" width="170" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="995" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#4338CA" text-anchor="middle">9-Step Pipeline Engine</text>
  </g>

  <!-- 3x3 Matrix of 9 Steps -->
  <g transform="translate(60, 95)" filter="url(#card-shadow)">

    <!-- Row 1: Steps 1 -> 2 -> 3 -->
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#EEF2FF"/>
      <circle cx="20" cy="16" r="10" fill="#4F46E5"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#312E81">preflight-check (Pre-flight)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">🔍 Environment &amp; Baseline Probing</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Verify Node/Git runtime environments</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Probe stack language &amp; resolve templates</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Detect snapshot index for incremental upgrade</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#F1F5F9"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Step 1: Environment &amp; Tech-Stack Probe</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 330 77 L 365 77" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#m-flow)"/>

    <!-- Step 2 -->
    <g transform="translate(375, 0)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#EEF2FF"/>
      <circle cx="20" cy="16" r="10" fill="#4F46E5"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#312E81">clean-target (Workspace Prune)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">🧹 Target Workspace Idempotent Clean</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Backup local configs to snapshot directory</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Prune stale rules &amp; expired symlinks</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Establish clean layout (.ide/, .agents/)</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#F1F5F9"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Step 2: Workspace Snapshot &amp; Pruning</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 705 77 L 740 77" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#m-flow)"/>

    <!-- Step 3 -->
    <g transform="translate(750, 0)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#EEF2FF"/>
      <circle cx="20" cy="16" r="10" fill="#4F46E5"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#312E81">build-project-rules (Rules Merge)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">📝 AST Heading-Level Rules Compile</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Read Common, Domain &amp; Role rulesets</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Override matching headings, append unique ones</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Output AGENTS.md SSOT &amp; thin pointer</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#F1F5F9"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Step 3: AST Heading-Level Rules Compile</text>
    </g>

    <!-- Arrow 3 -> 6 (Downwards from right) -->
    <path d="M 915 155 L 915 190" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#m-flow)"/>

    <!-- Row 2: Steps 6 <- 5 <- 4 -->
    <!-- Step 6 (on right) -->
    <g transform="translate(750, 195)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#EEF2FF"/>
      <circle cx="20" cy="16" r="10" fill="#4F46E5"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#312E81">build-git-configs (Git Guardrails)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">🔒 Guardrail Switches &amp; Ignore Stacking</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Generate .githooks.yml switches by role</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Stack Common + Domain + Local Ignore rules</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Install read-only scripts to .git/hooks/</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#F1F5F9"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Step 6: Git Hooks &amp; Ignore Stacking</text>
    </g>

    <!-- Arrow 6 -> 5 -->
    <path d="M 750 272 L 715 272" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#m-flow)"/>

    <!-- Step 5 -->
    <g transform="translate(375, 195)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#EEF2FF"/>
      <circle cx="20" cy="16" r="10" fill="#4F46E5"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#312E81">build-mcp-config (MCP Merge)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">🔌 Service-Level JSON Deep Merge</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Traverse mcpServers, deep merge tool configs</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Token placeholders protect local secrets</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Symlink root .mcp.json for CLI agents</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#F1F5F9"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Step 5: MCP JSON Deep Merge</text>
    </g>

    <!-- Arrow 5 -> 4 -->
    <path d="M 375 272 L 340 272" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#m-flow)"/>

    <!-- Step 4 -->
    <g transform="translate(0, 195)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#EEF2FF"/>
      <circle cx="20" cy="16" r="10" fill="#4F46E5"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#312E81">build-skills (Skill Pruning)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">🛠️ Skill Ingestion Filtering &amp; Packaging</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Parse registry.yaml access control list</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Physically prune skills outside role boundary</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Emit to .agents/skills/ and build symlink</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#F1F5F9"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Step 4: Skill Packaging &amp; Symlinking</text>
    </g>

    <!-- Arrow 4 -> 7 -->
    <path d="M 165 350 L 165 385" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#m-flow)"/>

    <!-- Row 3: Steps 7 -> 8 -> 9 -->
    <!-- Step 7 -->
    <g transform="translate(0, 390)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#EEF2FF"/>
      <circle cx="20" cy="16" r="10" fill="#4F46E5"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#312E81">build-hooks (Event Listeners)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">📡 IDE Event Interception Setup</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Configure SessionStart lifecycle hook</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Configure PostToolUse latency probes</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Initialize .telemetry/ local event buffer</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#F1F5F9"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Step 7: Event Hooks &amp; Telemetry Init</text>
    </g>

    <!-- Arrow 7 -> 8 -->
    <path d="M 330 467 L 365 467" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#m-flow)"/>

    <!-- Step 8 -->
    <g transform="translate(375, 390)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#EEF2FF"/>
      <circle cx="20" cy="16" r="10" fill="#4F46E5"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#312E81">summary (Manifest Generation)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">📋 Credentials &amp; Digest Solidification</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Generate CONFIG_SUMMARY.md manifest</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Record timestamp, role version &amp; file digests</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">• Provide baseline credentials for zero-clone PRs</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#F1F5F9"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Step 8: Manifest &amp; Digest Generation</text>
    </g>

    <!-- Arrow 8 -> 9 -->
    <path d="M 705 467 L 740 467" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#m-flow)"/>

    <!-- Step 9 -->
    <g transform="translate(750, 390)">
      <rect width="330" height="155" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
      <rect x="0" y="0" width="330" height="32" rx="10" fill="#ECFDF5"/>
      <circle cx="20" cy="16" r="10" fill="#10B981"/>
      <text x="20" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
      <text x="38" y="20" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#065F46">self-check (Integrity Audit)</text>
      <text x="14" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E293B">✅ 100% Idempotence &amp; Integrity Audit</text>
      <text x="14" y="72" font-family="sans-serif" font-size="9" font-weight="500" fill="#047857">• Audit .ide/ file integrity &amp; symlink reachability</text>
      <text x="14" y="88" font-family="sans-serif" font-size="9" font-weight="500" fill="#047857">• Check executable permissions (+x) on hooks</text>
      <text x="14" y="104" font-family="sans-serif" font-size="9" font-weight="500" fill="#047857">• Print success summary; IDE ready for action</text>
      <rect x="14" y="120" width="300" height="22" rx="4" fill="#DCFCE7"/>
      <text x="164" y="135" font-family="monospace" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">Step 9: Self-Verification &amp; Ready</text>
    </g>

  </g>
</svg>
