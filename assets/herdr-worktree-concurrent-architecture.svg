<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%" height="100%">
  <style>
    
    text {
      font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="arrow-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. Region Boundaries -->
  <!-- Left: Git Worktree Isolation Layer -->
  <rect x="30" y="70" width="415" height="320" rx="12" fill="none" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="45" y="92" fill="#0891b2" font-size="11" font-weight="700">地基一：Git Worktree 文件隔离层 (共享同一个 .git)</text>

  <!-- Right: herdr C/S Runtime Layer -->
  <rect x="475" y="70" width="415" height="320" rx="12" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="490" y="92" fill="#059669" font-size="11" font-weight="700">地基二：herdr C/S 会话存活与状态看板层</text>

  <!-- 3. Connections -->
  <!-- Main Repo <-> Worktrees (merge & config broadcast) -->
  <line x1="195" y1="185" x2="115" y2="225" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-primary)"/>
  <line x1="235" y1="185" x2="235" y2="225" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-primary)"/>
  <line x1="275" y1="185" x2="355" y2="225" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-primary)"/>
  <rect x="115" y="195" width="240" height="16" rx="4" fill="#f8fafc"/>
  <text x="235" y="207" fill="#0891b2" font-size="8.5" font-weight="600" text-anchor="middle">配置广播 ↓ · ↑ 分支 merge 收口 (wt 内禁 push)</text>

  <!-- Worktrees -> herdr Server PTYs -->
  <line x1="425" y1="265" x2="495" y2="250" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-secondary)"/>
  <text x="460" y="242" fill="#059669" font-size="8.5" font-weight="600" text-anchor="middle">PTY 绑定</text>

  <!-- herdr Server <-> TUI Sidebar -->
  <line x1="682" y1="185" x2="682" y2="215" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-secondary)"/>
  <text x="748" y="203" fill="#475569" font-size="8.5" text-anchor="middle">Unix Socket 附身/脱离</text>

  <!-- herdr Server -> Skill Fan-out -->
  <line x1="682" y1="290" x2="682" y2="312" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <!-- 4 & 5. Boxes -->
  <!-- Main Repo Box -->
  <rect x="55" y="110" width="365" height="75" rx="6" fill="#f8fafc"/>
  <rect x="55" y="110" width="365" height="75" rx="6" fill="rgba(59,130,246,0.12)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="237" y="133" fill="#0f172a" font-size="11.5" font-weight="700" text-anchor="middle">主仓 ~/code/myproject/ (master)</text>
  <text x="237" y="151" fill="#475569" font-size="9" text-anchor="middle">职责：配置 SSOT 广播 (.env/MCP) · git merge 冲突收口 · 唯一 git push</text>
  <text x="237" y="167" fill="#0891b2" font-size="9" font-weight="600" text-anchor="middle">底层单个 .git 对象库：各 Worktree 提交零延迟互见</text>

  <!-- Worktree 1 -->
  <rect x="50" y="225" width="115" height="80" rx="6" fill="#f8fafc"/>
  <rect x="50" y="225" width="115" height="80" rx="6" fill="rgba(6,182,212,0.12)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="107" y="248" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">wt-1 分支</text>
  <text x="107" y="266" fill="#475569" font-size="8.5" text-anchor="middle">--kind claude</text>
  <text x="107" y="282" fill="#475569" font-size="8" text-anchor="middle">独立工作目录</text>
  <text x="107" y="295" fill="#059669" font-size="8" font-weight="600" text-anchor="middle">只 commit 禁 push</text>

  <!-- Worktree 2 -->
  <rect x="180" y="225" width="115" height="80" rx="6" fill="#f8fafc"/>
  <rect x="180" y="225" width="115" height="80" rx="6" fill="rgba(6,182,212,0.12)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="237" y="248" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">wt-2 分支</text>
  <text x="237" y="266" fill="#475569" font-size="8.5" text-anchor="middle">--kind opencode</text>
  <text x="237" y="282" fill="#475569" font-size="8" text-anchor="middle">独立工作目录</text>
  <text x="237" y="295" fill="#059669" font-size="8" font-weight="600" text-anchor="middle">只 commit 禁 push</text>

  <!-- Worktree 3 -->
  <rect x="310" y="225" width="115" height="80" rx="6" fill="#f8fafc"/>
  <rect x="310" y="225" width="115" height="80" rx="6" fill="rgba(6,182,212,0.12)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="367" y="248" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">wt-3 分支</text>
  <text x="367" y="266" fill="#475569" font-size="8.5" text-anchor="middle">--kind pi / agy</text>
  <text x="367" y="282" fill="#475569" font-size="8" text-anchor="middle">编号不绑定 Agent</text>
  <text x="367" y="295" fill="#059669" font-size="8" font-weight="600" text-anchor="middle">现场按任务指定</text>

  <!-- Left Bottom Note -->
  <rect x="50" y="320" width="375" height="52" rx="6" fill="#f8fafc"/>
  <rect x="50" y="320" width="375" height="52" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.2"/>
  <text x="237" y="341" fill="#0f172a" font-size="9.5" font-weight="700" text-anchor="middle">托管路径：~/.herdr/worktrees/&lt;repo&gt;/wt-N/</text>
  <text x="237" y="359" fill="#475569" font-size="8.5" text-anchor="middle">herdr worktree create --cwd ~/code/myproject --branch wt-1 --base master</text>

  <!-- Right Top: Frontend TUI -->
  <rect x="495" y="110" width="375" height="75" rx="6" fill="#f8fafc"/>
  <rect x="495" y="110" width="375" height="75" rx="6" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.5"/>
  <text x="682" y="133" fill="#0f172a" font-size="11.5" font-weight="700" text-anchor="middle">前台视图：Tabby 终端 (或手机 Termius) + herdr TUI</text>
  <text x="682" y="151" fill="#475569" font-size="9" text-anchor="middle">鼠标右键分屏/切格 + Cmd+V 贴图 · 关窗/断连不杀进程</text>
  <text x="682" y="167" fill="#e11d48" font-size="9" font-weight="600" text-anchor="middle">侧边栏四态灯：working(绿) | blocked(红·等你按键) | done(蓝) | idle(灰)</text>

  <!-- Right Middle: herdr Daemon Server -->
  <rect x="495" y="215" width="375" height="75" rx="6" fill="#f8fafc"/>
  <rect x="495" y="215" width="375" height="75" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="682" y="238" fill="#0f172a" font-size="11.5" font-weight="700" text-anchor="middle">后台守护：herdr Daemon Server (持有全部 PTY)</text>
  <text x="682" y="256" fill="#475569" font-size="9" text-anchor="middle">单 Server 挂载多项目 Workspace · 24 种 Agent 原生识别</text>
  <text x="682" y="272" fill="#7c3aed" font-size="9" font-weight="600" text-anchor="middle">herdr integration install / hooks 主动权威上报状态</text>

  <!-- Right Bottom: Agent Self-Orchestration -->
  <rect x="495" y="312" width="375" height="60" rx="6" fill="#f8fafc"/>
  <rect x="495" y="312" width="375" height="60" rx="6" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1.5"/>
  <text x="682" y="334" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">第三层能力：Agent 自编排 (herdr --skill Fan-Out)</text>
  <text x="682" y="352" fill="#475569" font-size="8.5" text-anchor="middle">主 Agent 自主调用 pane split → agent start → prompt --wait → agent read</text>

  <!-- 7. Legend -->
  <rect x="30" y="408" width="860" height="36" rx="6" fill="#f8fafc"/>
  <rect x="30" y="408" width="860" height="36" rx="6" fill="rgba(100,116,139,0.12)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="430" fill="#0f172a" font-size="10" font-weight="600">三堵墙对应解法：</text>
  <circle cx="155" cy="426" r="5" fill="#0891b2"/>
  <text x="166" y="430" fill="#475569" font-size="10">文件互踩 → Git Worktree 物理隔离目录</text>
  <circle cx="410" cy="426" r="5" fill="#e11d48"/>
  <text x="421" y="430" fill="#475569" font-size="10">状态盲区 → Integration 权威 blocked/done 看板</text>
  <circle cx="695" cy="426" r="5" fill="#7c3aed"/>
  <text x="706" y="430" fill="#475569" font-size="10">会话脆弱 → Daemon 后台持有 PTY</text>

  <!-- 8. Title -->
  <text x="30" y="42" fill="#0f172a" font-size="16" font-weight="700">herdr × Git Worktree：项目级多 Agent 并发开发环境架构</text>
</svg>
