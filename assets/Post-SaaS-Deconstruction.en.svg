<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background-color:#F8FAFC;">
  <style>
    .diagram-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
    .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
    .node-dark { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #0F172A !important; text-anchor: middle; }
    .node-light { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #FFFFFF !important; text-anchor: middle; }
    .node-purple { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #6B21A8 !important; text-anchor: middle; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #E2E8F0 !important; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B !important; text-anchor: middle; }
  </style>

  <text x="600" y="35" class="diagram-title">Figure 1.1: Application Form Dissolution — From SaaS Silos to Capability Atom Networks</text>

  <!-- Legacy Silos -->
  <rect x="50" y="60" width="1100" height="210" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="70" y="82" class="layer-title" fill="#475569">Traditional Passive Enterprise Software Silos (Fragmented data locked inside legacy ERP / CRM / SCM / Chat apps)</text>
  
  <g transform="translate(80, 95)">
    <rect width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="155" y="25" class="node-dark">ERP · Inventory &amp; General Ledger</text>
    <rect x="345" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="500" y="25" class="node-dark">CRM · Leads &amp; Sales Pipeline</text>
    <rect x="690" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="845" y="25" class="node-dark">BI · Static Dashboards &amp; OLAP Cubes</text>

    <rect y="50" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="155" y="75" class="node-dark">SCM / WMS · Warehousing &amp; Logistics</text>
    <rect x="345" y="50" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="500" y="75" class="node-dark">MES · Shop Floor &amp; Defect Logs</text>
    <rect x="690" y="50" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="845" y="75" class="node-dark">PLM · Engineering BOM &amp; ECNs</text>

    <rect y="100" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="155" y="125" class="node-dark">Slack / Teams · Unstructured Chat</text>
    <rect x="345" y="100" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="500" y="125" class="node-dark">OA / HR · Approvals &amp; Performance</text>
    <rect x="690" y="100" width="310" height="40" rx="6" fill="#FAF5FF" stroke="#C084FC" stroke-dasharray="4 4"/><text x="845" y="125" class="node-purple">... and all legacy business software islands</text>
  </g>

  <!-- Connectors -->
  <path d="M 600 270 L 600 330" stroke="#6B21A8" stroke-width="3.5" fill="none" marker-end="url(#ar_dec)"/>
  <text x="600" y="296" class="edge-label" fill="#581C87">Application Form Dissolution</text>
  <text x="600" y="314" class="edge-label" fill="#581C87">Applications → Capability Atoms × Unified Data Ontology Fabric</text>

  <!-- Agent-Native Hub -->
  <rect x="50" y="340" width="1100" height="210" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="70" y="362" class="layer-title" fill="#1E1B4B">Agent-Native Enterprise Self-Healing Hub (On-demand Capability Assembly · Ephemeral UI Projections)</text>

  <g transform="translate(80, 375)">
    <rect width="450" height="60" rx="8" fill="#312E81" stroke="#4338CA"/><text x="225" y="27" class="node-light">Agentic Shell</text><text x="225" y="45" class="node-sub">(Unified interaction endpoint · Ephemeral projection terminal)</text>
    <rect x="490" width="450" height="60" rx="8" fill="#7C3AED" stroke="#6D28D9"/><text x="715" y="27" class="node-light">Semantic BI &amp; Ontology Compiler</text><text x="715" y="45" class="node-sub">(Real-time semantic analytics &amp; runtime compilation)</text>

    <rect y="75" width="300" height="60" rx="8" fill="#B45309" stroke="#D97706"/><text x="150" y="102" class="node-light">Autonomous Supply Mesh</text><text x="150" y="120" class="node-sub">(Self-healing SCM &amp; warehousing)</text>
    <rect x="340" y="75" width="300" height="60" rx="8" fill="#065F46" stroke="#047857"/><text x="490" y="102" class="node-light">Capability Atom Pool</text><text x="490" y="120" class="node-sub">(MCP capability atoms · dynamic binding)</text>
    <rect x="680" y="75" width="300" height="60" rx="8" fill="#6B21A8" stroke="#581C87"/><text x="830" y="102" class="node-light">Data Ontology Fabric</text><text x="830" y="120" class="node-sub">(Unified physical enterprise data mesh)</text>
  </g>

  <defs>
    <marker id="ar_dec" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B21A8"/></marker>
  </defs>
</svg>
