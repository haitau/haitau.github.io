<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background-color:#F8FAFC;">
  <style>
    .diagram-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
    .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
    .node-dark { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #0F172A !important; text-anchor: middle; }
    .node-light { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #FFFFFF !important; text-anchor: middle; }
    .node-purple { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #6B21A8 !important; text-anchor: middle; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #E2E8F0 !important; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B !important; text-anchor: middle; }
  </style>

  <text x="600" y="35" class="diagram-title">图 1：应用形态消融 —— 从 SaaS 烟囱到能力原子网络</text>

  <!-- Legacy -->
  <rect x="50" y="60" width="1100" height="210" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="70" y="82" class="layer-title" fill="#475569">传统被动企业软件烟囱 (割裂在各类 ERP/CRM/SCM/企微 内部的数据碎块)</text>
  
  <g transform="translate(80, 95)">
    <rect width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="155" y="25" class="node-dark">ERP · 进销存与总账</text>
    <rect x="345" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="500" y="25" class="node-dark">CRM · 客户线索与商机</text>
    <rect x="690" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="845" y="25" class="node-dark">BI · 固化看板与 Cube 维度</text>

    <rect y="50" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="155" y="75" class="node-dark">SCM / WMS · 仓储物流与采购</text>
    <rect x="345" y="50" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="500" y="75" class="node-dark">MES · 产线调度与工时缺陷</text>
    <rect x="690" y="50" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="845" y="75" class="node-dark">PLM · 研发 BOM 与变更单</text>

    <rect y="100" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="155" y="125" class="node-dark">企微/飞书 · 非结构化沟通流</text>
    <rect x="345" y="100" width="310" height="40" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="500" y="125" class="node-dark">OA / HR · 审批与考勤绩效</text>
    <rect x="690" y="100" width="310" height="40" rx="6" fill="#FAF5FF" stroke="#C084FC" stroke-dasharray="4 4"/><text x="845" y="125" class="node-purple">... 以及一切传统业务软件孤岛</text>
  </g>

  <!-- 连线 -->
  <path d="M 600 270 L 600 330" stroke="#6B21A8" stroke-width="3.5" fill="none" marker-end="url(#ar_dec)"/>
  <text x="600" y="296" class="edge-label" fill="#581C87">应用形态消融 (Application Form Dissolution)</text>
  <text x="600" y="314" class="edge-label" fill="#581C87">应用 → 能力原子 × 数据本体大集合 (Unified Data Ontology Fabric)</text>

  <!-- Agent-Native -->
  <rect x="50" y="340" width="1100" height="210" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="70" y="362" class="layer-title" fill="#1E1B4B">Agent-Native 企业自愈中枢 (能力原子按需组合 · 交互投影即用即散)</text>

  <g transform="translate(80, 375)">
    <rect width="450" height="60" rx="8" fill="#312E81" stroke="#4338CA"/><text x="225" y="27" class="node-light">Agent Shell</text><text x="225" y="45" class="node-sub">(替代企微/飞书统一端 · 交互投影出口)</text>
    <rect x="490" width="450" height="60" rx="8" fill="#7C3AED" stroke="#6D28D9"/><text x="715" y="27" class="node-light">Semantic BI &amp; Ontology Compiler</text><text x="715" y="45" class="node-sub">(数据本体编译器/即时分析)</text>

    <rect y="75" width="300" height="60" rx="8" fill="#B45309" stroke="#D97706"/><text x="150" y="102" class="node-light">Autonomous Supply Mesh</text><text x="150" y="120" class="node-sub">(自愈式供应链与仓储)</text>
    <rect x="340" y="75" width="300" height="60" rx="8" fill="#065F46" stroke="#047857"/><text x="490" y="102" class="node-light">Capability Atom Pool</text><text x="490" y="120" class="node-sub">(MCP 能力原子池 · 按需组合)</text>
    <rect x="680" y="75" width="300" height="60" rx="8" fill="#6B21A8" stroke="#581C87"/><text x="830" y="102" class="node-light">Data Ontology Fabric</text><text x="830" y="120" class="node-sub">(数据本体大集合物理基底)</text>
  </g>

  <defs>
    <marker id="ar_dec" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B21A8"/></marker>
  </defs>
</svg>