<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background-color:#F8FAFC;">
  <style>
    .diagram-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
    .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
    .node-dark { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #0F172A !important; text-anchor: middle; }
    .node-light { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #FFFFFF !important; text-anchor: middle; }
    .node-purple { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #6B21A8 !important; text-anchor: middle; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #E2E8F0 !important; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B !important; text-anchor: middle; }
  </style>

  <text x="600" y="40" class="diagram-title">图 2.3：专题下钻 B - 确定性保障 (模板化 Proposer → FSM Gatekeeper → 分级双签)</text>

  <!-- 上：规则库 -->
  <g transform="translate(460, 90)">
    <rect width="280" height="70" rx="8" fill="#F59E0B" stroke="#D97706"/>
    <text x="140" y="40" class="node-light">硬性合规与 RBAC 规则库</text>
  </g>

  <!-- 中行：Proposer → FSM → DB -->
  <g transform="translate(100, 230)">
    <rect width="240" height="80" rx="8" fill="#B45309" stroke="#92400E"/>
    <text x="120" y="45" class="node-light">Agent 方案提议者 (Proposer)</text>
  </g>
  <g transform="translate(460, 230)">
    <rect width="280" height="80" rx="8" fill="#991B1B" stroke="#7F1D1D"/>
    <text x="140" y="45" class="node-light">Strict FSM 强状态机闸口</text>
  </g>
  <g transform="translate(860, 230)">
    <rect width="240" height="80" rx="8" fill="#0F172A" stroke="#020617"/>
    <text x="120" y="45" class="node-light">Headless 状态</text>
  </g>

  <!-- 下左：动作模板库 -->
  <g transform="translate(100, 400)">
    <rect width="240" height="70" rx="8" fill="#D97706" stroke="#B45309"/>
    <text x="120" y="30" class="node-light">Action Template 动作模板库</text>
    <text x="120" y="50" class="node-sub">(高价值动作仅填预置参数)</text>
  </g>

  <!-- 下右：人类双签 -->
  <g transform="translate(820, 400)">
    <rect width="240" height="70" rx="8" fill="#312E81" stroke="#4338CA"/>
    <text x="120" y="30" class="node-light">Human 双签确认</text>
    <text x="120" y="50" class="node-sub">(L2/L3 · 资金/合同/人事)</text>
  </g>

  <!-- 连线 -->
  <path d="M 220 400 L 220 310" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#ar2)"/>
  <text x="220" y="358" class="edge-label">1. 模板化填充（禁自由原语）</text>

  <path d="M 340 270 L 460 270" stroke="#B45309" stroke-width="3" fill="none" marker-end="url(#ar2)"/>
  <text x="400" y="258" class="edge-label">2. 模板化 Payload</text>

  <path d="M 600 160 L 600 230" stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#ar2)"/>
  <text x="652" y="198" class="edge-label">3. 规约比对</text>

  <path d="M 740 270 L 860 270" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#ar2)"/>
  <text x="800" y="258" class="edge-label">4a. 校验通过</text>

  <path d="M 600 310 L 600 500 L 80 500 L 80 270 L 100 270" stroke="#991B1B" stroke-width="3" stroke-dasharray="5 5" fill="none" marker-end="url(#ar2)"/>
  <text x="340" y="490" class="edge-label" fill="#991B1B">4b. 违规/越权 fail-closed 硬拒绝</text>

  <path d="M 700 310 L 700 435 L 820 435" stroke="#312E81" stroke-width="3" fill="none" marker-end="url(#ar2)"/>
  <text x="778" y="422" class="edge-label">4c. 升格人类双签</text>

  <path d="M 940 400 L 940 310" stroke="#312E81" stroke-width="3" fill="none" marker-end="url(#ar2)"/>
  <text x="992" y="358" class="edge-label">5. 双签后执行</text>

  <defs><marker id="ar2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
</svg>
