<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background-color:#F8FAFC;">
  <style>
    .diagram-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
    .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 400; fill: #CBD5E1; }
    .tpl-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #78350F; }
    .tpl-body { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #92400E; }
    .term-text { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 11px; fill: #A7F3D0; }
    .term-err { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 12px; font-weight: 700; fill: #FCA5A5; }
    .term-tip { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 700; fill: #FDE047; }
  </style>

  <text x="600" y="35" class="diagram-title">图 3.1：Git 护栏矩阵 —— 一套通用脚本与声明式开关分流机制</text>

  <!-- Top: Shared Scripts -->
  <rect x="50" y="60" width="1100" height="105" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="70" y="82" class="box-title" fill="#0F172A">共享核心执行脚本 (全公司物理同一套 · 只读分发至 .git/hooks/ · 逻辑零分叉)</text>

  <g transform="translate(70, 95)">
    <rect width="250" height="55" rx="6" fill="#1E293B"/>
    <text x="125" y="24" class="node-title" text-anchor="middle">commit-msg Hook</text>
    <text x="125" y="42" class="node-sub" text-anchor="middle">规范正则 / 长度 / 资产 tag 检查</text>

    <rect x="270" width="250" height="55" rx="6" fill="#1E293B"/>
    <text x="395" y="24" class="node-title" text-anchor="middle">pre-commit Hook</text>
    <text x="395" y="42" class="node-sub" text-anchor="middle">受保护分支 / 硬编码密钥扫描</text>

    <rect x="540" width="250" height="55" rx="6" fill="#1E293B"/>
    <text x="665" y="24" class="node-title" text-anchor="middle">pre-push Hook</text>
    <text x="665" y="42" class="node-sub" text-anchor="middle">铁律拦截 force-push / 主干直推</text>

    <rect x="810" width="250" height="55" rx="6" fill="#1E293B"/>
    <text x="935" y="24" class="node-title" text-anchor="middle">pre-rebase Hook</text>
    <text x="935" y="42" class="node-sub" text-anchor="middle">按策略阻断已推送历史重写</text>
  </g>

  <!-- Middle: Declarative Switch Matrix -->
  <rect x="50" y="185" width="1100" height="155" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="70" y="207" class="box-title" fill="#92400E">声明式开关配置文件 (.githooks.yml · 依据角色画像模板按需分流)</text>

  <g transform="translate(70, 220)">
    <!-- Template Dev -->
    <rect width="335" height="105" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="15" y="22" class="tpl-title">工程开发模板 (base.yml)</text>
    <text x="15" y="44" class="tpl-body">• master_protected: true (禁止主干直接提交/推包)</text>
    <text x="15" y="64" class="tpl-body">• diff_guard: true (扫描代码硬编码密钥与 Token)</text>
    <text x="15" y="84" class="tpl-body">• block_rebase_pushed: false (个人特性分支放行)</text>

    <!-- Template PM -->
    <rect x="360" width="340" height="105" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="375" y="22" class="tpl-title">产品管理模板 (pm.yml)</text>
    <text x="375" y="44" class="tpl-body">• master_protected: false (单人主干极速直推)</text>
    <text x="375" y="64" class="tpl-body">• diff_guard: false (文档库豁免控制台/关键字检查)</text>
    <text x="375" y="84" class="tpl-body">• asset_guard: true (修改敏感受保护资产需显式标记)</text>

    <!-- Template Algo -->
    <rect x="725" width="335" height="105" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="740" y="22" class="tpl-title">算法研究模板 (ai-algo.yml)</text>
    <text x="740" y="44" class="tpl-body">• master_protected: true (模型迭代强制走评估流)</text>
    <text x="740" y="64" class="tpl-body">• sensitive_patterns: [MLflow_Key, S3_Key, CUDA]</text>
    <text x="740" y="84" class="tpl-body">• check_divergence: true (大模型基线落后探针)</text>
  </g>

  <!-- Bottom: Self-Healing Diagnostic Terminal -->
  <rect x="50" y="360" width="1100" height="260" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="70" y="382" class="box-title" fill="#065F46">结构化诊断与自愈闭环体验 (Actionable Self-Healing Diagnostic Output)</text>

  <g transform="translate(70, 395)">
    <rect width="1060" height="210" rx="8" fill="#064E3B" stroke="#059669"/>
    
    <text x="20" y="30" class="term-err">❌ [GIT GUARD 拦截]：检测到未授权的主干直接提交操作！</text>
    <text x="20" y="52" class="term-text">========================================================================================</text>
    <text x="20" y="75" class="term-text">触发拦截项: pre_commit.master_protected = true</text>
    <text x="20" y="97" class="term-text">违规上下文: 当前处于 master 主干分支，团队工程规范要求所有特性开发必须走分支 + MR 协同。</text>
    <text x="20" y="119" class="term-text">----------------------------------------------------------------------------------------</text>
    <text x="20" y="142" class="term-tip">💡 AI / 开发者自愈操作建议 (可直接复制到终端执行):</text>
    <text x="20" y="165" class="term-text">   git checkout -b feat/your-feature-name</text>
    <text x="20" y="187" class="term-text">   git commit -m "feat(scope): 描述具体业务变更" &amp;&amp; git push -u origin feat/your-feature-name</text>
  </g>
</svg>
