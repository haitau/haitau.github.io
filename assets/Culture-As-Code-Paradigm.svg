<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Filters -->
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="glow-indigo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.25"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="header-bad-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="header-good-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="soft-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="hard-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366F1"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect x="25" y="25" width="1150" height="650" rx="16" fill="#FFFFFF" fill-opacity="0.7" stroke="#E2E8F0" stroke-width="1.5" filter="url(#soft-shadow)"/>

  <!-- Diagram Title Banner -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="6" height="26" rx="3" fill="#4F46E5"/>
    <text x="18" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="800" fill="#0F172A" letter-spacing="-0.5px">
      图 1.1：规范即代码 (Culture as Code) 范式演进与主客观双层咬合体系
    </text>
    <rect x="940" y="2" width="140" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="1010" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#4338CA" text-anchor="middle">Agent-Native Paradigm</text>
  </g>

  <!-- Top Left: Legacy Paradigm Card -->
  <g transform="translate(60, 95)" filter="url(#card-shadow)">
    <rect width="520" height="215" rx="12" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 38 L 0 38 Z" fill="url(#header-bad-grad)"/>
    <text x="20" y="24" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">❌ 传统自由对话接入模式 (High Friction &amp; Uncertainty)</text>

    <g transform="translate(18, 52)">
      <!-- Item 1 -->
      <rect y="0" width="484" height="34" rx="6" fill="#FFF1F2" stroke="#FFE4E6"/>
      <circle cx="16" cy="17" r="4" fill="#E11D48"/>
      <text x="30" y="21" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#9F1239">人人各自编写 Prompt，团队架构规约与业务资产无法穿透</text>

      <!-- Item 2 -->
      <rect y="40" width="484" height="34" rx="6" fill="#FFF1F2" stroke="#FFE4E6"/>
      <circle cx="16" cy="17" r="4" fill="#E11D48"/>
      <text x="30" y="21" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#9F1239">无序堆砌规则引发严重上下文污染，触发模型注意力衰减与幻觉</text>

      <!-- Item 3 -->
      <rect y="80" width="484" height="34" rx="6" fill="#FFF1F2" stroke="#FFE4E6"/>
      <circle cx="16" cy="17" r="4" fill="#E11D48"/>
      <text x="30" y="21" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#9F1239">纯靠口头弱约束，AI 误推保护主干、改写公共历史破坏远程仓库</text>

      <!-- Item 4 -->
      <rect y="120" width="484" height="34" rx="6" fill="#FFF1F2" stroke="#FFE4E6"/>
      <circle cx="16" cy="17" r="4" fill="#E11D48"/>
      <text x="30" y="21" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#9F1239">个人 Prompt 随电脑更换丢失，单向灌输缺乏回流沉淀机制</text>
    </g>
  </g>

  <!-- Top Right: Modern Paradigm Card -->
  <g transform="translate(620, 95)" filter="url(#card-shadow)">
    <rect width="520" height="215" rx="12" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 38 L 0 38 Z" fill="url(#header-good-grad)"/>
    <text x="20" y="24" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">✅ 企业级 AI 脚手架范式 (Culture as Code Infrastructure)</text>

    <g transform="translate(18, 52)">
      <!-- Item 1 -->
      <rect y="0" width="484" height="34" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/>
      <circle cx="16" cy="17" r="4" fill="#059669"/>
      <text x="30" y="21" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#065F46">规范即代码：文化、规约与 SOP 编译为可分发、可版本化的 IDE 基座</text>

      <!-- Item 2 -->
      <rect y="40" width="484" height="34" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/>
      <circle cx="16" cy="17" r="4" fill="#059669"/>
      <text x="30" y="21" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#065F46">三层领域驱动隔离：Common → Domain → Role 精准按需装配</text>

      <!-- Item 3 -->
      <rect y="80" width="484" height="34" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/>
      <circle cx="16" cy="17" r="4" fill="#059669"/>
      <text x="30" y="21" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#065F46">主客观双层咬合：上层软规引导意图 + 下层客观硬护栏底线兜底</text>

      <!-- Item 4 -->
      <rect y="120" width="484" height="34" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/>
      <circle cx="16" cy="17" r="4" fill="#059669"/>
      <text x="30" y="21" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#065F46">双向进化闭环：零克隆远程回流 + IDE 全周期 Telemetry 可观测性</text>
    </g>
  </g>

  <!-- Bottom: Interlocking Mechanism Big Container -->
  <g transform="translate(60, 325)" filter="url(#card-shadow)">
    <rect width="1080" height="330" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="1080" height="36" rx="14" fill="#F8FAFC"/>
    <text x="24" y="23" font-family="sans-serif" font-size="13" font-weight="800" fill="#1E293B">🔄 主客观双层咬合机制 (Subjective-Objective Interlocking Architecture)</text>
    <rect x="880" y="8" width="180" height="20" rx="10" fill="#E2E8F0"/>
    <text x="970" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Single Source of Truth (SSOT)</text>

    <!-- Upper Layer: Soft Prompts -->
    <g transform="translate(20, 48)">
      <rect width="1040" height="85" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
      <path d="M 0 10 Q 0 0 10 0 L 1030 0 Q 1040 0 1040 10 L 1040 26 L 0 26 Z" fill="url(#soft-grad)"/>
      <text x="16" y="18" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">【上层：主观软规范 · Rules 面向 AI 上下文】</text>

      <g transform="translate(15, 34)">
        <!-- Card S1 -->
        <rect x="0" y="0" width="325" height="42" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/>
        <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338CA">👁️ 前置探针 (Read-First Probe)</text>
        <text x="12" y="32" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">落笔前通读关联接口、公共函数与架构设计</text>

        <!-- Card S2 -->
        <rect x="345" y="0" width="330" height="42" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/>
        <text x="357" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338CA">🔄 提交闭环规约 (Commit Flow)</text>
        <text x="357" y="32" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">统一 Conventional Commits / 工单前缀绑定</text>

        <!-- Card S3 -->
        <rect x="695" y="0" width="325" height="42" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/>
        <text x="707" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338CA">🚨 分支路由决策 (Branch Routing)</text>
        <text x="707" y="32" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">严格按角色策略决策特性分支 vs 主干协同</text>
      </g>
    </g>

    <!-- Middle Connector: Configuration Switch Contract -->
    <g transform="translate(20, 142)">
      <rect width="1040" height="32" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
      <circle cx="20" cy="16" r="6" fill="#F59E0B"/>
      <text x="35" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#92400E">
        ⚙️ 声明式配置开关契约 (.githooks.yml) —— 软规范与硬拦截同源分流，同一份配置参数驱动 AI 提示词与 Hook 脚本
      </text>
    </g>

    <!-- Lower Layer: Hard Guardrails -->
    <g transform="translate(20, 182)">
      <rect width="1040" height="135" rx="10" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1.5"/>
      <path d="M 0 10 Q 0 0 10 0 L 1030 0 Q 1040 0 1040 10 L 1040 26 L 0 26 Z" fill="url(#hard-grad)"/>
      <text x="16" y="18" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">【下层：客观硬护栏 · Git Hooks 本地确定性拦截】</text>

      <g transform="translate(15, 34)">
        <!-- Hook 1 -->
        <rect x="0" y="0" width="240" height="90" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
        <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">commit-msg Hook</text>
        <text x="12" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• Header 长度 ≤ 100 字符</text>
        <text x="12" y="58" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 格式正则/工单号强制校验</text>
        <text x="12" y="76" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 受保护资产变更 [资产] 标记</text>

        <!-- Hook 2 -->
        <rect x="255" y="0" width="245" height="90" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
        <text x="267" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">pre-commit Hook</text>
        <text x="267" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 拦截未授权分支直接提交</text>
        <text x="267" y="58" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 扫描暂存区硬编码 Secret/Key</text>
        <text x="267" y="76" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 敏感文件路径修改鉴权</text>

        <!-- Hook 3 -->
        <rect x="515" y="0" width="245" height="90" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
        <text x="527" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">pre-push Hook</text>
        <text x="527" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 拦截直推主干，强制提 MR</text>
        <text x="527" y="58" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 绝对阻断 force-push 破坏历史</text>
        <text x="527" y="76" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 自动探测本地落后远程基线</text>

        <!-- Hook 4 -->
        <rect x="775" y="0" width="245" height="90" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
        <text x="787" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">pre-rebase Hook</text>
        <text x="787" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 阻断已推送公共历史 rebase</text>
        <text x="787" y="58" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 避免多人协作提交线紊乱</text>
        <text x="787" y="76" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#374151">• 个人特性分支安全放行</text>
      </g>
    </g>
  </g>
</svg>
