<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="h-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="h-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <marker id="m-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366F1"/>
    </marker>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect x="25" y="25" width="1150" height="630" rx="16" fill="#FFFFFF" fill-opacity="0.7" stroke="#E2E8F0" stroke-width="1.5" filter="url(#soft-shadow)"/>

  <!-- Title -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="6" height="26" rx="3" fill="#4F46E5"/>
    <text x="18" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="800" fill="#0F172A" letter-spacing="-0.5px">
      图 4.1：双向进化闭环 —— 零克隆远程回流架构与 IDE 全周期 Telemetry 可观测体系
    </text>
    <rect x="880" y="2" width="200" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="980" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#4338CA" text-anchor="middle">Bi-directional Evolution Loop</text>
  </g>

  <!-- Left: Zero-Clone Contribution Pipeline -->
  <g transform="translate(60, 90)" filter="url(#card-shadow)">
    <rect width="520" height="540" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 36 L 0 36 Z" fill="url(#h-left)"/>
    <text x="20" y="23" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">
      🚀 零克隆远程回流流水线 (Zero-Clone Contribution Pipeline)
    </text>

    <g transform="translate(18, 48)">
      <!-- Step 1 -->
      <g>
        <rect width="484" height="65" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338CA">1. 本地差异计算与防篡改鉴权</text>
        <text x="14" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">• 读取 CONFIG_SUMMARY.md 凭证，与远程基线求 Diff</text>
        <text x="14" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">• 严格校验变更范围，阻断非特化目录的越权侵入</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 75)">
        <rect width="484" height="65" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338CA">2. 本地敏感信息多重脱敏过滤</text>
        <text x="14" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">• 扫描并剔除本地绝对路径 (/Users/...)、个人私有 Token</text>
        <text x="14" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">• 自动占位符化敏感环境变量，保证回流资产公共安全</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 150)">
        <rect width="484" height="65" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338CA">3. HTTP 结构化 Payload 远程投递</text>
        <text x="14" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">• 开发者无需 git clone 脚手架主仓库与配置权限</text>
        <text x="14" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">• CLI 发送脱敏 JSON Payload 至配置中心网关</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 225)">
        <rect width="484" height="65" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338CA">4. 云端服务侧 Git Open API 自动建分支提 PR</text>
        <text x="14" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">• 网关鉴权，基于 Git Open API 创建 contrib/&lt;user&gt; 分支</text>
        <text x="14" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#6B7280">• 自动提交并创建 Pull Request，无缝流转至架构师评审</text>
      </g>

      <!-- Footer Callout -->
      <rect y="300" width="484" height="42" rx="6" fill="#4338CA"/>
      <text x="242" y="25" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        零门槛回流：从"个人私藏 Prompt"跃迁为"全员共享工程资产"
      </text>
    </g>
  </g>

  <!-- Right: IDE Telemetry Observability -->
  <g transform="translate(620, 90)" filter="url(#card-shadow)">
    <rect width="520" height="540" rx="12" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 36 L 0 36 Z" fill="url(#h-right)"/>
    <text x="20" y="23" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">
      📊 IDE 全周期 Telemetry 可观测性 (Telemetry Observability)
    </text>

    <g transform="translate(18, 48)">
      <!-- Hook S1 -->
      <g>
        <rect width="484" height="65" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">1. IDE 原生事件多点捕获 (Event Hooks)</text>
        <text x="14" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#047857">• SessionStart: 记录角色、会话场景、加载规则版本</text>
        <text x="14" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#047857">• PostToolUse: 捕获 Skill 触发率、MCP 响应耗时与异常</text>
      </g>

      <!-- Hook S2 -->
      <g transform="translate(0, 75)">
        <rect width="484" height="65" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">2. 本地只追加高性能缓冲日志 (Append-Only Log)</text>
        <text x="14" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#047857">• 毫秒级异步写本地 .telemetry/events.jsonl，零阻塞编码</text>
        <text x="14" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#047857">• 内置 7 天滚动归档机制，防止本地磁盘无限膨胀</text>
      </g>

      <!-- Hook S3 -->
      <g transform="translate(0, 150)">
        <rect width="484" height="65" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">3. 智能批量异步上报 (Batch Flush Pipeline)</text>
        <text x="14" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#047857">• 满足批量阈值 (N条) 或空闲周期自动后台静默上报</text>
        <text x="14" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#047857">• 异常离线自动重试，保证可观测数据完整性</text>
      </g>

      <!-- Hook S4 -->
      <g transform="translate(0, 225)">
        <rect width="484" height="65" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#065F46">4. 效能大盘分析与架构反馈 (Metrics &amp; Feedback)</text>
        <text x="14" y="40" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#047857">• 统计各规则触发频次、低频僵死规则智能识别</text>
        <text x="14" y="54" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#047857">• 量化研发效能 ROI，精准指导下一代脚手架迭代</text>
      </g>

      <!-- Footer Callout -->
      <rect y="300" width="484" height="42" rx="6" fill="#065F46"/>
      <text x="242" y="25" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        全景度量：以客观真实数据驱动规则资产持续优胜劣汰
      </text>
    </g>
  </g>
</svg>
