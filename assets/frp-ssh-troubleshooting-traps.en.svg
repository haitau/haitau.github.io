<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <style>
    
    text {
      font-family: 'JetBrains Mono', 'SF Mono', 'Noto Sans', sans-serif;
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow-alert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
    <marker id="arrow-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 3 Trap Columns -->
  <!-- Col 1: Trap 1 TUN fake-ip -->
  <rect x="30" y="70" width="275" height="315" rx="10" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="45" y="92" fill="#e11d48" font-size="10" font-weight="700">Trap 1: Local TUN False Positive</text>

  <!-- Col 2: Trap 2 Loopback sshd silence -->
  <rect x="322" y="70" width="275" height="315" rx="10" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="337" y="92" fill="#d97706" font-size="10" font-weight="700">Trap 2: VPS Loopback sshd Silence</text>

  <!-- Col 3: Trap 3 Cloud Security Group -->
  <rect x="615" y="70" width="275" height="315" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="630" y="92" fill="#7c3aed" font-size="10" font-weight="700">Trap 3: Cloud Security Group Blindspot</text>

  <!-- Arrows down inside each column -->
  <line x1="167" y1="185" x2="167" y2="215" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-alert)"/>
  <line x1="167" y1="285" x2="167" y2="305" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-secondary)"/>

  <line x1="460" y1="185" x2="460" y2="215" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-alert)"/>
  <line x1="460" y1="285" x2="460" y2="305" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-secondary)"/>

  <line x1="752" y1="185" x2="752" y2="215" stroke="#e11d48" stroke-width="1.6" marker-end="url(#arrow-alert)"/>
  <line x1="752" y1="285" x2="752" y2="305" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-secondary)"/>

  <!-- Col 1 Boxes -->
  <rect x="47" y="110" width="240" height="75" rx="6" fill="#f8fafc"/>
  <rect x="47" y="110" width="240" height="75" rx="6" fill="rgba(225,29,72,0.12)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="167" y="133" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Misleading Symptom</text>
  <text x="167" y="152" fill="#475569" font-size="8.5" text-anchor="middle">Mac runs nc -zv VPS_IP 6022</text>
  <text x="167" y="168" fill="#e11d48" font-size="8.5" font-weight="600" text-anchor="middle">Always returns "succeeded"</text>

  <rect x="47" y="215" width="240" height="70" rx="6" fill="#f8fafc"/>
  <rect x="47" y="215" width="240" height="70" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5"/>
  <text x="167" y="238" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Root Cause</text>
  <text x="167" y="256" fill="#475569" font-size="8.5" text-anchor="middle">Clash/mihomo TUN fake-ip stack</text>
  <text x="167" y="272" fill="#475569" font-size="8.5" text-anchor="middle">ACKs SYN locally without egress</text>

  <rect x="47" y="305" width="240" height="65" rx="6" fill="#f8fafc"/>
  <rect x="47" y="305" width="240" height="65" rx="6" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.6"/>
  <text x="167" y="328" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Fix &amp; Verification</text>
  <text x="167" y="346" fill="#059669" font-size="8.5" font-weight="600" text-anchor="middle">Probe from an external cloud host</text>
  <text x="167" y="360" fill="#475569" font-size="8.5" text-anchor="middle">or phone on cellular network</text>

  <!-- Col 2 Boxes -->
  <rect x="340" y="110" width="240" height="75" rx="6" fill="#f8fafc"/>
  <rect x="340" y="110" width="240" height="75" rx="6" fill="rgba(225,29,72,0.12)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="460" y="133" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Misleading Symptom</text>
  <text x="460" y="152" fill="#475569" font-size="8.5" text-anchor="middle">Testing 127.0.0.1:6022 on VPS</text>
  <text x="460" y="168" fill="#e11d48" font-size="8.5" font-weight="600" text-anchor="middle">TCP connects, SSH banner hangs</text>

  <rect x="340" y="215" width="240" height="70" rx="6" fill="#f8fafc"/>
  <rect x="340" y="215" width="240" height="70" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5"/>
  <text x="460" y="238" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Root Cause</text>
  <text x="460" y="256" fill="#475569" font-size="8.5" text-anchor="middle">Artifact of VPS self-loopback</text>
  <text x="460" y="272" fill="#475569" font-size="8.5" text-anchor="middle">Diverges from real public ingress</text>

  <rect x="340" y="305" width="240" height="65" rx="6" fill="#f8fafc"/>
  <rect x="340" y="305" width="240" height="65" rx="6" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.6"/>
  <text x="460" y="328" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Fix &amp; Verification</text>
  <text x="460" y="346" fill="#059669" font-size="8.5" font-weight="600" text-anchor="middle">Match real user path: External</text>
  <text x="460" y="360" fill="#475569" font-size="8.5" text-anchor="middle">Client → VPS Public IP:6022</text>

  <!-- Col 3 Boxes -->
  <rect x="632" y="110" width="240" height="75" rx="6" fill="#f8fafc"/>
  <rect x="632" y="110" width="240" height="75" rx="6" fill="rgba(225,29,72,0.12)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="752" y="133" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Misleading Symptom</text>
  <text x="752" y="152" fill="#475569" font-size="8.5" text-anchor="middle">ss -tlnp &amp; frp logs all green</text>
  <text x="752" y="168" fill="#e11d48" font-size="8.5" font-weight="600" text-anchor="middle">Public connection times out</text>

  <rect x="632" y="215" width="240" height="70" rx="6" fill="#f8fafc"/>
  <rect x="632" y="215" width="240" height="70" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5"/>
  <text x="752" y="238" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Root Cause</text>
  <text x="752" y="256" fill="#475569" font-size="8.5" text-anchor="middle">Cloud Security Group sits outside</text>
  <text x="752" y="272" fill="#475569" font-size="8.5" text-anchor="middle">OS firewall (invisible to ss)</text>

  <rect x="632" y="305" width="240" height="65" rx="6" fill="#f8fafc"/>
  <rect x="632" y="305" width="240" height="65" rx="6" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.6"/>
  <text x="752" y="328" fill="#0f172a" font-size="10.5" font-weight="700" text-anchor="middle">Fix &amp; Verification</text>
  <text x="752" y="346" fill="#059669" font-size="8.5" font-weight="600" text-anchor="middle">Check Cloud Console rules first</text>
  <text x="752" y="360" fill="#475569" font-size="8.5" text-anchor="middle">Align allowPorts &amp; remotePort</text>

  <!-- Title -->
  <text x="30" y="42" fill="#0f172a" font-size="15" font-weight="700">Troubleshooting Methodology: Question Your Probes First — Three Field Traps</text>
</svg>
