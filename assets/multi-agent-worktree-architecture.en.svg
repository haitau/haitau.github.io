<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b7a8c"/>
    </marker>
  </defs>

  <!-- Top: Main GUI Agent -->
  <rect x="200" y="20" width="500" height="100" rx="8" fill="#e8f0fe" stroke="#4a90d9" stroke-width="2"/>
  <text x="450" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Main GUI Agent (Orchestrator IDE)</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#5b7a8c">Main Workspace · master Branch</text>
  <text x="450" y="88" text-anchor="middle" font-size="12" fill="#7f8c8d">Trae / Antigravity / Cursor …</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#95a5a6">Architecture Planning · Scheduling · Merge Review · git push</text>

  <!-- Connecting line: main to shared -->
  <line x1="450" y1="120" x2="450" y2="155" stroke="#5b7a8c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Shared git label -->
  <rect x="325" y="155" width="250" height="28" rx="14" fill="#f0f4f8" stroke="#b0c4de" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#5b7a8c">Shared Underlying .git Repository</text>

  <!-- Three downward arrows -->
  <line x1="250" y1="183" x2="250" y2="215" stroke="#5b7a8c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="183" x2="450" y2="215" stroke="#5b7a8c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="183" x2="650" y2="215" stroke="#5b7a8c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Worktree Slot 1 -->
  <rect x="50" y="220" width="240" height="160" rx="8" fill="#f5faf5" stroke="#27ae60" stroke-width="2"/>
  <rect x="50" y="220" width="240" height="30" rx="8" fill="#27ae60"/>
  <rect x="50" y="240" width="240" height="10" fill="#27ae60"/>
  <text x="170" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Worktree Slot 1</text>
  <text x="170" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#2c3e50">feature/claude</text>
  <text x="170" y="286" text-anchor="middle" font-size="11" fill="#7f8c8d">../project-claude</text>
  <line x1="70" y1="298" x2="270" y2="298" stroke="#d5e8d4" stroke-width="1"/>
  <text x="170" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">CLI: Claude Code</text>
  <text x="170" y="334" text-anchor="middle" font-size="11" fill="#7f8c8d">Config: .claude/</text>
  <text x="170" y="352" text-anchor="middle" font-size="11" fill="#7f8c8d">Local commit · No push</text>
  <text x="170" y="370" text-anchor="middle" font-size="10" fill="#95a5a6">(Persistent slot · Deletion forbidden)</text>

  <!-- Worktree Slot 2 -->
  <rect x="330" y="220" width="240" height="160" rx="8" fill="#f5f0fa" stroke="#8e44ad" stroke-width="2"/>
  <rect x="330" y="220" width="240" height="30" rx="8" fill="#8e44ad"/>
  <rect x="330" y="240" width="240" height="10" fill="#8e44ad"/>
  <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Worktree Slot 2</text>
  <text x="450" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#2c3e50">feature/opencode</text>
  <text x="450" y="286" text-anchor="middle" font-size="11" fill="#7f8c8d">../project-opencode</text>
  <line x1="350" y1="298" x2="550" y2="298" stroke="#e1d5e7" stroke-width="1"/>
  <text x="450" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#8e44ad">CLI: OpenCode</text>
  <text x="450" y="334" text-anchor="middle" font-size="11" fill="#7f8c8d">Config: .opencode/</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#7f8c8d">Local commit · No push</text>
  <text x="450" y="370" text-anchor="middle" font-size="10" fill="#95a5a6">(Persistent slot · Deletion forbidden)</text>

  <!-- Worktree Slot N -->
  <rect x="610" y="220" width="240" height="160" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <rect x="610" y="220" width="240" height="30" rx="8" fill="#f39c12"/>
  <rect x="610" y="240" width="240" height="10" fill="#f39c12"/>
  <text x="730" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Worktree Slot N</text>
  <text x="730" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#2c3e50">feature/&lt;agent-n&gt;</text>
  <text x="730" y="286" text-anchor="middle" font-size="11" fill="#7f8c8d">../project-&lt;n&gt;</text>
  <line x1="630" y1="298" x2="830" y2="298" stroke="#fdebd0" stroke-width="1"/>
  <text x="730" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#f39c12">CLI: Other Compatible Agent</text>
  <text x="730" y="334" text-anchor="middle" font-size="11" fill="#7f8c8d">Config: Slot-specific</text>
  <text x="730" y="352" text-anchor="middle" font-size="11" fill="#7f8c8d">Local commit · No push</text>
  <text x="730" y="370" text-anchor="middle" font-size="10" fill="#95a5a6">(Persistent slot · Deletion forbidden)</text>

  <!-- Bottom annotation -->
  <rect x="200" y="410" width="500" height="40" rx="6" fill="#fdf2f2" stroke="#e6b0aa" stroke-width="1"/>
  <text x="450" y="428" text-anchor="middle" font-size="11" fill="#c0392b">⚠ All child slots only perform local commits; git push is exclusively executed by the main workspace after merge</text>
  <text x="450" y="444" text-anchor="middle" font-size="10" fill="#a04040">Push forbidden · Worktree &amp; branch deletion forbidden</text>

  <!-- Legend -->
  <rect x="50" y="470" width="12" height="12" rx="2" fill="#27ae60"/>
  <text x="68" y="480" font-size="10" fill="#5b7a8c">Claude Code</text>
  <rect x="170" y="470" width="12" height="12" rx="2" fill="#8e44ad"/>
  <text x="188" y="480" font-size="10" fill="#5b7a8c">OpenCode</text>
  <rect x="290" y="470" width="12" height="12" rx="2" fill="#f39c12"/>
  <text x="308" y="480" font-size="10" fill="#5b7a8c">Other Compatible Agent</text>
  <text x="450" y="480" text-anchor="middle" font-size="10" fill="#95a5a6">Each slot: independent CLI process · independent config · shared underlying .git</text>
</svg>