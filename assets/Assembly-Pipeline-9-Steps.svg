<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background-color:#F8FAFC;">
  <style>
    .diagram-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
    .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 400; fill: #E2E8F0; }
    .pre-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #78350F; }
    .pre-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #92400E; }
    .succ-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
  </style>

  <text x="600" y="35" class="diagram-title">图 6.1：CLI 引擎 9 步原子化装配流水线全景</text>

  <!-- Pre-Flight Phase -->
  <rect x="50" y="60" width="1100" height="110" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="70" y="82" class="box-title" fill="#92400E">前置准备阶段 (Pre-Flight Phase · 零污染与安全防护)</text>

  <g transform="translate(70, 95)">
    <rect width="335" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="15" y="24" class="pre-title">HTTP 直拉最新配置 Tarball</text>
    <text x="15" y="44" class="pre-sub">解压至系统临时目录，避免 node_modules 污染</text>

    <rect x="360" width="340" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="375" y="24" class="pre-title">自动创建快照备份 (Backup)</text>
    <text x="375" y="44" class="pre-sub">保留至多 10 份历史快照，支持秒级无损回滚</text>

    <rect x="725" width="335" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="740" y="24" class="pre-title">清理废弃历史配置 (Cleanup)</text>
    <text x="740" y="44" class="pre-sub">对比废弃清单，物理剔除过期的规则与 MCP 服务</text>
  </g>

  <!-- 9-Step Pipeline -->
  <rect x="50" y="190" width="1100" height="350" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="70" y="212" class="box-title" fill="#1E1B4B">9 步原子化编译装配执行流水线 (9-Step Atomic Assembly Pipeline)</text>

  <g transform="translate(70, 225)">
    <!-- Row 1: Step 1-3 -->
    <g>
      <rect width="335" height="85" rx="6" fill="#312E81"/>
      <text x="15" y="24" class="node-title">Step 1: buildUserRules()</text>
      <text x="15" y="46" class="node-sub">• 生成开发者个人全局规则</text>
      <text x="15" y="66" class="node-sub">• 输出: .ide/global-user-rules.md</text>

      <rect x="360" width="340" height="85" rx="6" fill="#312E81"/>
      <text x="375" y="24" class="node-title">Step 2: buildProjectRules()</text>
      <text x="375" y="46" class="node-sub">• 标题级语义合并 Markdown 规则</text>
      <text x="375" y="66" class="node-sub">• 继承通用基座，覆盖特化章节</text>

      <rect x="725" width="335" height="85" rx="6" fill="#312E81"/>
      <text x="740" y="24" class="node-title">Step 3: buildSkills()</text>
      <text x="740" y="46" class="node-sub">• 按准入注册表黑白名单过滤</text>
      <text x="740" y="66" class="node-sub">• 物理注入角色特化技能包</text>
    </g>

    <!-- Row 2: Step 4-6 -->
    <g transform="translate(0, 95)">
      <rect width="335" height="85" rx="6" fill="#4338CA"/>
      <text x="15" y="24" class="node-title">Step 4: buildMcpConfig()</text>
      <text x="15" y="46" class="node-sub">• 服务级深度合并 mcp.json</text>
      <text x="15" y="66" class="node-sub">• 参数特化与凭据占位隔离</text>

      <rect x="360" width="340" height="85" rx="6" fill="#4338CA"/>
      <text x="375" y="24" class="node-title">Step 5: injectWorkspaceAssets()</text>
      <text x="375" y="46" class="node-sub">• 注入团队工程辅助模板与脚本</text>
      <text x="375" y="66" class="node-sub">• 标准化工作区工具链与环境</text>

      <rect x="725" width="335" height="85" rx="6" fill="#4338CA"/>
      <text x="740" y="24" class="node-title">Step 6: createSummaryFile()</text>
      <text x="740" y="46" class="node-sub">• 生成装配摘要 CONFIG_SUMMARY.md</text>
      <text x="740" y="66" class="node-sub">• 记录角色画像与资产版本索引</text>
    </g>

    <!-- Row 3: Step 7-9 -->
    <g transform="translate(0, 190)">
      <rect width="335" height="85" rx="6" fill="#4F46E5"/>
      <text x="15" y="24" class="node-title">Step 7: buildGitScaffold()</text>
      <text x="15" y="46" class="node-sub">• 行级清洗并三层堆叠 Gitignore</text>
      <text x="15" y="66" class="node-sub">• 强制全局统一 LF 换行规则</text>

      <rect x="360" width="340" height="85" rx="6" fill="#4F46E5"/>
      <text x="375" y="24" class="node-title">Step 8: buildGitHooks()</text>
      <text x="375" y="46" class="node-sub">• 分发通用 Hook 硬执行脚本</text>
      <text x="375" y="66" class="node-sub">• 注入角色专属 .githooks.yml 开关</text>

      <rect x="725" width="335" height="85" rx="6" fill="#4F46E5"/>
      <text x="740" y="24" class="node-title">Step 9: buildTelemetryHooks()</text>
      <text x="740" y="46" class="node-sub">• 挂载 IDE 事件监听 hooks.json</text>
      <text x="740" y="66" class="node-sub">• 连通效能监测与可观测性闭环</text>
    </g>
  </g>

  <!-- Success Bar -->
  <rect x="50" y="560" width="1100" height="40" rx="8" fill="#10B981" stroke="#059669"/>
  <text x="600" y="585" class="succ-text">✨ 装配流水线执行完毕：工作区环境已自动对齐企业最新技术基准，即刻生效！</text>
</svg>
