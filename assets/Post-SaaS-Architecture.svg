<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background-color:#F8FAFC;">
  <style>
    .diagram-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
    .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
    .node-dark { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #0F172A !important; text-anchor: middle; }
    .node-light { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #FFFFFF !important; text-anchor: middle; }
    .node-purple { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #6B21A8 !important; text-anchor: middle; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #E2E8F0 !important; text-anchor: middle; }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B !important; text-anchor: middle; }
  </style>

  <text x="600" y="35" class="diagram-title">图 2.1：Post-SaaS 终局全景架构 (Agent Shell + Kernel + MCP + Data Ontology Fabric)</text>

  <!-- L1 -->
  <rect x="50" y="60" width="1100" height="110" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="70" y="80" class="layer-title" fill="#1E1B4B">1. Agentic Communication Shell Layer (统一语义交互与即时分析层)</text>
  <g transform="translate(80, 95)">
    <rect width="230" height="60" rx="8" fill="#312E81" stroke="#4338CA"/><text x="115" y="27" class="node-light">Agent Shell</text><text x="115" y="45" class="node-sub">(替代企微/飞书统一端)</text>
    <rect x="260" width="250" height="60" rx="8" fill="#4338CA" stroke="#3730A3"/><text x="385" y="27" class="node-light">BI &amp; Interaction Projection</text><text x="385" y="45" class="node-sub">(语义即时分析 × 交互投影)</text>
    <rect x="540" width="230" height="60" rx="8" fill="#4F46E5" stroke="#4338CA"/><text x="655" y="27" class="node-light">Semantic Cache &amp; SLM</text><text x="655" y="45" class="node-sub">(端侧算力与局部缓存)</text>
    <rect x="800" width="240" height="60" rx="8" fill="#6366F1" stroke="#4F46E5"/><text x="920" y="27" class="node-light">Design System</text><text x="920" y="45" class="node-sub">(组件库 × 审美宪法/偏好双层)</text>
  </g>

  <!-- L2 -->
  <rect x="50" y="195" width="1100" height="110" rx="10" fill="#FFFBEB" stroke="#FBBF24" stroke-width="2"/>
  <text x="70" y="215" class="layer-title" fill="#451A03">2. Reactive Agent Kernel &amp; Ontology Compiler (Agent 编排与数据本体内核)</text>
  <g transform="translate(80, 230)">
    <rect width="230" height="60" rx="8" fill="#7C3AED" stroke="#6D28D9"/><text x="115" y="27" class="node-light">Ontology Compiler</text><text x="115" y="45" class="node-sub">(数据本体语义编译器)</text>
    <rect x="260" width="250" height="60" rx="8" fill="#D97706" stroke="#B45309"/><text x="385" y="27" class="node-light">Multi-Tier Decision Engine</text><text x="385" y="45" class="node-sub">(多级决策: L1自治/L2协同/L3升格)</text>
    <rect x="540" width="230" height="60" rx="8" fill="#991B1B" stroke="#7F1D1D"/><text x="655" y="27" class="node-light">Strict FSM Gatekeeper</text><text x="655" y="45" class="node-sub">(强状态机硬拦截闸口)</text>
    <rect x="800" width="240" height="60" rx="8" fill="#F59E0B" stroke="#D97706"/><text x="920" y="27" class="node-light">Hybrid Task Dispatcher</text><text x="920" y="45" class="node-sub">(Human-Agent 混合任务分发)</text>
  </g>

  <!-- L3 -->
  <rect x="50" y="330" width="1100" height="110" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
  <text x="70" y="350" class="layer-title" fill="#064E3B">3. Dual-Mode MCP Protocol Mesh Layer (双工 MCP 协议与数据本体传输网关)</text>
  <g transform="translate(80, 365)">
    <rect width="300" height="60" rx="8" fill="#065F46" stroke="#047857"/><text x="150" y="27" class="node-light">Resolver × Connector Gateway</text><text x="150" y="45" class="node-sub">(统一接入底座 × 向量语义寻址)</text>
    <rect x="320" width="360" height="60" rx="8" fill="#059669" stroke="#047857"/><text x="500" y="27" class="node-light" text-anchor="middle">Ontology Data Broker</text><text x="500" y="45" class="node-sub" text-anchor="middle">(数据本体大集合访问代理)</text>
    <rect x="700" width="340" height="60" rx="8" fill="#10B981" stroke="#059669"/><text x="870" y="27" class="node-light" text-anchor="middle">B2B Agent Mesh</text><text x="870" y="45" class="node-sub" text-anchor="middle">(跨企业 Agent 自动对接网)</text>
  </g>

  <!-- L4 -->
  <rect x="50" y="465" width="1100" height="115" rx="10" fill="#FAF5FF" stroke="#6B21A8" stroke-width="2"/>
  <text x="70" y="485" class="layer-title" fill="#581C87">4. Unified Enterprise Data Ontology Fabric (企业数据本体物理大集合)</text>
  <g transform="translate(80, 500)">
    <rect width="260" height="65" rx="8" fill="#581C87" stroke="#3B0764"/><text x="130" y="30" class="node-light">Data CDC Stream Monitor</text><text x="130" y="48" class="node-sub">(数据变更与沟通流捕获)</text>
    <rect x="370" width="450" height="65" rx="8" fill="#6B21A8" stroke="#581C87"/><text x="595" y="28" class="node-light">Enterprise Data Ontology Fabric (数据本体大集合)</text><text x="595" y="48" class="node-sub">[ 哲学实体映射 + 全量业务数据 + 沟通流 + 历史行为 ]</text>
    <rect x="850" width="220" height="65" rx="8" fill="#334155" stroke="#1E293B"/><text x="960" y="30" class="node-light">Immutable Audit Log</text><text x="960" y="48" class="node-sub">(只读不可篡改审计日志)</text>
  </g>

  <!-- 连线 -->
  <path d="M 600 170 L 600 195" stroke="#4338CA" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="712" y="186" class="edge-label">① 语义交互 &amp; 动作回调</text>
  <path d="M 600 305 L 600 330" stroke="#B45309" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <text x="706" y="321" class="edge-label">② 本体意图与合规校验</text>
  <path d="M 600 440 L 600 465" stroke="#6B21A8" stroke-width="2.5" fill="none" marker-end="url(#a3)"/>
  <text x="712" y="456" class="edge-label">③ 本体数据池提取 &amp; 直连</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338CA"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B21A8"/></marker>
  </defs>
</svg>